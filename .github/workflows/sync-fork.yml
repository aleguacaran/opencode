name: sync-fork

# Weekly sync of `node-release` with the original anomalyco/opencode `dev`.
# Runs Mondays at 05:00 UTC (an hour before the daily release check) and on demand.
#
# Merges upstream/dev directly into node-release while keeping our
# `.github/workflows` untouched: the GITHUB_TOKEN is never allowed to push
# workflow-file changes, so upstream's workflow updates are stripped from the
# merge. Conflicts elsewhere fail the run loudly for manual resolution.
# Uses plain shell (no external actions) so the actions-allowlist policy
# cannot block it.

on:
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency: sync-fork

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        run: |
          git clone "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${{ github.token }}@github.com/$GITHUB_REPOSITORY.git"
          git remote add upstream https://github.com/anomalyco/opencode.git
          git fetch upstream dev

      - name: Merge upstream dev into node-release
        run: |
          git merge --no-commit --no-ff upstream/dev || true
          git rm -rq --cached .github/workflows 2>/dev/null || true
          git checkout HEAD -- .github/workflows 2>/dev/null || true
          if git diff --quiet --cached HEAD; then
            echo "node-release is already up to date with upstream dev"
            exit 0
          fi
          if ! git commit --no-edit; then
            git merge --abort 2>/dev/null || true
            echo "::error::Merge conflicts with upstream dev — resolve manually:"
            echo "::error::git fetch origin dev && git merge origin/dev"
            exit 1
          fi
          git push origin node-release
