name: sync-fork

# Weekly sync of the fork with the original anomalyco/opencode:
#   1. fast-forward the fork's `dev` to the original's `dev`
#   2. merge `dev` into `node-release` (the default/release branch)
# Runs Mondays at 05:00 UTC (an hour before the daily release check) and on demand.
# A merge conflict fails the run loudly so it gets resolved manually.
# Uses plain shell (no external actions) so the actions-allowlist policy cannot block it.

on:
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency: sync-fork

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        run: |
          git clone "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${{ github.token }}@$GITHUB_SERVER_HOST/$GITHUB_REPOSITORY.git"

      - name: Sync dev with upstream
        run: |
          git remote add upstream https://github.com/anomalyco/opencode.git
          git fetch upstream dev
          git checkout dev
          git merge --ff-only upstream/dev || git merge upstream/dev --no-edit
          git push origin dev

      - name: Merge dev into node-release
        run: |
          git checkout node-release
          if ! git merge origin/dev --no-edit; then
            git merge --abort || true
            echo "::error::Merge of dev into node-release has conflicts — resolve manually:"
            echo "::error::git checkout node-release && git merge origin/dev"
            exit 1
          fi
          git push origin node-release
