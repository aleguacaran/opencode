# Updated compose: node builder runs node for mini build
name: opencode

services:
  builder:
    image: node:lts-slim
    command:
      - sh
      - -c
      - |
          apt-get update && apt-get install -y python3 make g++ git curl unzip libicu-dev && \
          git config --global --add safe.directory /app && \
          git config --global --add safe.directory /app/src && \
          curl -fsSL https://bun.sh/install | bash && \
          export PATH="/root/.bun/bin:$PATH" && \
          cd /app/src && \
          bun install && \
          cd /app/src/packages/sdk/js && \
          rm -rf dist ./*.tsbuildinfo && \
          bun tsc && \
          chown 1000:1000 /app/src/packages/sdk/js/tsconfig.tsbuildinfo 2>/dev/null || true && \
          cd /app/src/packages/opencode && \
          bun run script/build-node.ts && \
          bun run buildMini.js && \
          cd /app/src/packages/opencode/dist/node && \
          rm -rf node_modules && mkdir -p node_modules && \
          cp -r /app/src/node_modules/.bun/jsonc-parser@3.3.1/node_modules/jsonc-parser node_modules/jsonc-parser && \
          cp -r /app/src/node_modules/.bun/@lydell+node-pty@1.2.0-beta.12/node_modules/@lydell node_modules/@lydell && \
          rm -rf node_modules/@lydell/node-pty-linux-x64 && \
          cp -r /app/src/node_modules/.bun/@lydell+node-pty-linux-x64@1.2.0-beta.12/node_modules/@lydell/node-pty-linux-x64 node_modules/@lydell/node-pty-linux-x64 && \
          rm -rf /app/.docker-context && \
          mkdir -p /app/.docker-context && \
          cp /app/src/Dockerfile.mini /app/.docker-context/Dockerfile.mini && \
          tar -C /app/src --exclude='*.map' --exclude='packages/opencode/dist/opencode-*' -cf - opencode packages/opencode/dist packages/opencode/node_modules packages/sdk/js/dist packages/sdk/js/package.json | tar -C /app/.docker-context -xf - && \
          mkdir -p /app/.docker-context/packages/sdk/js/node_modules && \
          for p in cross-spawn@7.0.6/node_modules/cross-spawn which@2.0.2/node_modules/which isexe@2.0.0/node_modules/isexe path-key@3.1.1/node_modules/path-key shebang-command@2.0.0/node_modules/shebang-command shebang-regex@3.0.0/node_modules/shebang-regex; do cp -r "/app/src/node_modules/.bun/$$p" "/app/.docker-context/packages/sdk/js/node_modules/$${p##*/}"; done && \
          rm -f /app/.docker-context/packages/opencode/dist/node/*.map /app/.docker-context/packages/opencode/dist/node/cli-main.js && \
          chown -R 1000:1000 /app/.docker-context && \
          cd /app/src/packages/opencode && \
          if [ -d dist/node ]; then mv dist/node /app/.keep-node; fi && \
          { bun run script/build.ts --single --baseline --skip-install --skip-embed-web-ui > /tmp/build.log 2>&1 && echo BINARY_OK || { tail -15 /tmp/build.log; exit 1; }; } && \
          if [ -d /app/.keep-node ]; then mkdir -p dist && mv /app/.keep-node dist/node; fi && \
          tar -czf dist/opencode-linux-x64-baseline.tar.gz -C dist/opencode-linux-x64-baseline/bin opencode
    working_dir: /app
    volumes:
      - ../:/app
    user: root

  runtime:
    image: node:lts-slim
    volumes:
      - ../:/app
    working_dir: /app
    command: ./src/opencode "write a short poem about the sun"

  headless:
    image: opencode-headless:latest
    build:
      context: ../.docker-context
      dockerfile: Dockerfile.mini
